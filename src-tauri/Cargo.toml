[package]
name = "better-harness"
version = "0.3.0"
description = "Lightweight harness for the claude CLI (a replacement for the Code tab of Claude Desktop)"
edition = "2021"
rust-version = "1.80"

[lib]
name = "better_harness_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros"] }
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
dirs = "6"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
trash = "5.2.3"
base64 = "0.22"
imagesize = "0.14"
tauri-plugin-updater = "2"
# Already built for the updater: the beta channel reads the release list from the GitHub API.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
semver = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
