# Règles d'une PR (branche, titre, auteurs, version), exigées avant tout merge dans main
# par le ruleset « main » (scripts/protections.mjs). Relancé quand le titre change.
name: Règles

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: regles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test scripts/regles.test.mjs
      # Les règles appliquées sont celles de main : une PR ne peut pas assouplir le contrôle qui la juge.
      # (Première PR seulement : main n'a pas encore le fichier, on prend celui de la PR.)
      - name: Règles de main appliquées à la PR
        run: |
          if git cat-file -e "origin/$BASE_REF:scripts/regles.mjs" 2>/dev/null; then
            git show "origin/$BASE_REF:scripts/regles.mjs" > "$RUNNER_TEMP/regles.mjs"
          else
            cp scripts/regles.mjs "$RUNNER_TEMP/regles.mjs"
          fi
          node "$RUNNER_TEMP/regles.mjs" ci
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}

