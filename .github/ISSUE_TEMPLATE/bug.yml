name: Bug
description: Something doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: English or French, both are fine.
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a session in…
        2. Send…
        3. See…
  - type: input
    id: version
    attributes:
      label: Better Harness version
      description: Settings → About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and chip
      placeholder: macOS 15.5, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Optional. Remove anything private before posting.
      render: text
