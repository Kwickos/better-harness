name: Documentation
description: Something missing, wrong or unclear in the docs.
labels: [documentation]
body:
  - type: markdown
    attributes:
      value: English or French, both are fine.
  - type: input
    id: where
    attributes:
      label: Page or section
      placeholder: README → Updates
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What's wrong or missing
    validations:
      required: true
