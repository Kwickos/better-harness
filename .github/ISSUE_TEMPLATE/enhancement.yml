name: Enhancement
description: A new feature or an improvement to an existing one.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: English or French, both are fine.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's missing or painful today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like instead. Mockups welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
